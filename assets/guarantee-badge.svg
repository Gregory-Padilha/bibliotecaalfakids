<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 220" width="220" height="220">
  <defs>
    <linearGradient id="goldOuter" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="35%" stop-color="#D97706"/>
      <stop offset="70%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <linearGradient id="goldInner" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <filter id="badgeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#D97706" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Golden Laurel Wreath Leaves (Left and Right) -->
  <g stroke="#D97706" stroke-width="2" fill="#F59E0B" opacity="0.95">
    <!-- Left Leaves -->
    <path d="M 45 130 C 35 110 38 85 58 65" fill="none" stroke-width="3"/>
    <ellipse cx="40" cy="115" rx="7" ry="4" transform="rotate(-30 40 115)"/>
    <ellipse cx="36" cy="95" rx="7" ry="4" transform="rotate(-15 36 95)"/>
    <ellipse cx="42" cy="78" rx="7" ry="4" transform="rotate(10 42 78)"/>
    <ellipse cx="54" cy="65" rx="7" ry="4" transform="rotate(35 54 65)"/>

    <!-- Right Leaves -->
    <path d="M 175 130 C 185 110 182 85 162 65" fill="none" stroke-width="3"/>
    <ellipse cx="180" cy="115" rx="7" ry="4" transform="rotate(30 180 115)"/>
    <ellipse cx="184" cy="95" rx="7" ry="4" transform="rotate(15 184 95)"/>
    <ellipse cx="178" cy="78" rx="7" ry="4" transform="rotate(-10 178 78)"/>
    <ellipse cx="166" cy="65" rx="7" ry="4" transform="rotate(-35 166 65)"/>
  </g>

  <!-- Outer Golden Starburst Circle -->
  <circle cx="110" cy="100" r="72" fill="url(#goldOuter)" filter="url(#badgeGlow)"/>
  <circle cx="110" cy="100" r="66" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5" stroke-dasharray="3,3"/>
  <circle cx="110" cy="100" r="60" fill="url(#goldInner)"/>

  <!-- Stars -->
  <g fill="#FBBF24">
    <polygon points="110,50 112,55 117,55 113,58 115,63 110,60 105,63 107,58 103,55 108,55" transform="scale(0.8) translate(28, 12)"/>
    <polygon points="110,50 112,55 117,55 113,58 115,63 110,60 105,63 107,58 103,55 108,55" transform="scale(0.9) translate(12, 6)"/>
    <polygon points="110,50 112,55 117,55 113,58 115,63 110,60 105,63 107,58 103,55 108,55"/>
    <polygon points="110,50 112,55 117,55 113,58 115,63 110,60 105,63 107,58 103,55 108,55" transform="scale(0.9) translate(-12, 6)"/>
    <polygon points="110,50 112,55 117,55 113,58 115,63 110,60 105,63 107,58 103,55 108,55" transform="scale(0.8) translate(-28, 12)"/>
  </g>

  <!-- Big Number 7 -->
  <text x="110" y="104" font-family="'Nunito', sans-serif" font-size="44" font-weight="900" fill="url(#goldOuter)" text-anchor="middle">
    7
  </text>
  <text x="110" y="122" font-family="'Nunito', sans-serif" font-size="14" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">
    DIAS
  </text>
  <text x="110" y="136" font-family="'Inter', sans-serif" font-size="8.5" font-weight="700" fill="#93C5FD" text-anchor="middle" letter-spacing="1">
    GARANTIA
  </text>

  <!-- Golden Ribbon Banner at Bottom -->
  <g transform="translate(0, 15)">
    <!-- Ribbon ends -->
    <polygon points="30,172 45,158 45,182" fill="#92400E"/>
    <polygon points="190,172 175,158 175,182" fill="#92400E"/>
    <!-- Ribbon Body -->
    <rect x="40" y="156" width="140" height="24" rx="4" fill="url(#goldOuter)" stroke="#78350F" stroke-width="1"/>
    <text x="110" y="172" font-family="'Inter', sans-serif" font-size="9" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">
      INCONDICIONAL • 100%
    </text>
  </g>
</svg>
