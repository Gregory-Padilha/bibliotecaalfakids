  <!-- Illustration Icon Area -->
  <g id="illustration">
    <rect x="85" y="115" width="70" height="52" rx="4" fill="#FFF"/><path d="M120 115 V167" stroke="#4338CA" stroke-width="2"/><path d="M92 125 H112 M92 135 H112 M92 145 H106" stroke="#94A3B8" stroke-width="2"/><path d="M128 125 H148 M128 135 H148 M128 145 H140" stroke="#94A3B8" stroke-width="2"/><circle cx="120" cy="102" r="10" fill="#EF4444"/><path d="M116 102 Q120 98 124 102 Q120 107 116 102 Z" fill="#FFF"/>
  </g>

