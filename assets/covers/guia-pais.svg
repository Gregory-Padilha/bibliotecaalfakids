  <rect x="22" y="214" width="196" height="78" rx="10" fill="#FFFFFF"/>
  <text x="120" y="240" fill="#18181B" font-family="'Nunito', 'Segoe UI', sans-serif" font-size="13" font-weight="900" text-anchor="middle" letter-spacing="-0.2">GUIA RÁPIDO</text>
  <text x="120" y="258" fill="#4338CA" font-family="'Nunito', 'Segoe UI', sans-serif" font-size="11" font-weight="800" text-anchor="middle">PARA PAIS</text>
  
  <rect x="44" y="268" width="152" height="14" rx="7" fill="#F4EFEA"/>
  <text x="120" y="278" fill="#71717A" font-family="'Inter', sans-serif" font-size="8.5" font-weight="700" text-anchor="middle">KIT BÍBLICO DIGITAL • A4</text>
