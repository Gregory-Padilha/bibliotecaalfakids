<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 320" width="240" height="320">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B45309"/>
      <stop offset="100%" stop-color="#78350F"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Base Cover Card -->
  <rect x="12" y="12" width="216" height="296" rx="16" fill="url(#grad)" filter="url(#shadow)"/>

  <!-- Spine 3D Highlight -->
  <rect x="12" y="12" width="12" height="296" rx="4" fill="rgba(255, 255, 255, 0.18)"/>

  <!-- Top Badge Tag -->
  <rect x="36" y="32" width="168" height="22" rx="11" fill="rgba(255, 255, 255, 0.2)"/>
  <text x="120" y="47" fill="#FFFFFF" font-family="'Nunito', 'Segoe UI', sans-serif" font-size="10" font-weight="800" text-anchor="middle" letter-spacing="1">EXTRA DO KIT</text>

  <!-- Illustration Icon Area -->
  <g id="illustration">
    <rect x="80" y="115" width="80" height="56" rx="4" fill="#FFF" stroke="#F59E0B" stroke-width="2"/><circle cx="120" cy="143" r="12" fill="#FBBF24"/><path d="M116 153 L113 167 L120 162 L127 167 L124 153 Z" fill="#D97706"/><path d="M92 125 H110 M130 125 H148 M92 133 H148" stroke="#E2E8F0" stroke-width="2"/>
  </g>

  <!-- Bottom Title Box -->
  <rect x="22" y="214" width="196" height="78" rx="10" fill="#FFFFFF"/>
  <text x="120" y="240" fill="#18181B" font-family="'Nunito', 'Segoe UI', sans-serif" font-size="13" font-weight="900" text-anchor="middle" letter-spacing="-0.2">CERTIFICADO</text>
  <text x="120" y="258" fill="#B45309" font-family="'Nunito', 'Segoe UI', sans-serif" font-size="11" font-weight="800" text-anchor="middle">PEQUENO DISCÍPULO</text>
  
  <rect x="44" y="268" width="152" height="14" rx="7" fill="#F4EFEA"/>
  <text x="120" y="278" fill="#71717A" font-family="'Inter', sans-serif" font-size="8.5" font-weight="700" text-anchor="middle">KIT BÍBLICO DIGITAL • A4</text>
</svg>